[project]
name = "p1-student"
version = "0.1.0"
description = "Patch localization and image-feature experiments on native 64x64 images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "Pillow>=10,<13",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.9,<4",
    "torch>=2.2,<3",
    "joblib>=1.3,<2",
    "threadpoolctl>=3,<4",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]
